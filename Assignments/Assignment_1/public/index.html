<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure File Upload</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Secure File Upload</h1>
    <p class="hint">Allowed: PNG, JPG, GIF, PDF &middot; Max 5 MB &middot; One file at a time</p>

    <form id="upload-form">
      <label for="file-input" class="drop-zone" id="drop-zone">
        <span id="drop-text">Click to choose a file or drag it here</span>
        <input type="file" id="file-input" name="file" accept=".png,.jpg,.jpeg,.gif,.pdf" required>
      </label>
      <button type="submit" id="upload-btn">Upload</button>
    </form>

    <div id="status" role="status" aria-live="polite"></div>

    <h2>Uploaded files</h2>
    <table>
      <thead>
        <tr><th>Name</th><th>Type</th><th>Size</th><th>Uploaded</th><th></th></tr>
      </thead>
      <tbody id="file-list"></tbody>
    </table>
  </main>
  <script src="app.js"></script>
</body>
</html>
